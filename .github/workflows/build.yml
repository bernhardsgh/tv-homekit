name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: unzip -q tv-homekit.zip
      - run: cd tv-homekit && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          files: tv-homekit/app/build/outputs/apk/debug/app-debug.apk
